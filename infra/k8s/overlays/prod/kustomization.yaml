# Prod overlay: the application only.
#
#   kubectl kustomize infra/k8s/overlays/prod
#
# It runs no Postgres, no Redis and no Ollama. Managed Postgres (with pgvector available and a
# NOSUPERUSER, NOBYPASSRLS role — ADR-0002 requires both) and managed Redis are the deployment's
# responsibility, and their addresses arrive in the Secret.
#
# It also GENERATES NO SECRET. `tenantiq-secrets` is created out of band, which is why the name here
# has no content hash: a generated Secret would either live in git or be a fiction. Create it with:
#
#   kubectl -n tenantiq create secret generic tenantiq-secrets \
#     --from-literal=DATABASE_URL='postgresql://USER:PASS@HOST:5432/tenantiq' \
#     --from-literal=DJANGO_SECRET_KEY="$(openssl rand -base64 48)" \
#     --from-literal=VOYAGE_API_KEY='...' \
#     --from-literal=ANTHROPIC_API_KEY='...'
#
# ...or from a secrets manager via External Secrets / Sealed Secrets. The trade-off of the unhashed
# name is real and worth stating: rotating the Secret does NOT roll the pods, so a rotation has to be
# followed by `kubectl rollout restart`. docs/deployment.md says so where someone will read it.
#
# UNFINISHED, deliberately, and named rather than implied: the image this deploys as `frontend` is
# built from frontend/Dockerfile, whose CMD is `next dev`. A production image (`next build` +
# standalone output) belongs with #25.
#
# Embeddings are settled (#53, ADR-0020): this overlay points the embedder at Voyage, which needs
# VOYAGE_API_KEY in the Secret above. GENERATION is not, and the default here is deliberate — with no
# ANTHROPIC_API_KEY the LLM factory falls back to Ollama, which does not run in this namespace, so a
# query fails loudly instead of billing an account nobody meant to use. Set ANTHROPIC_API_KEY to
# answer questions; leave it unset to deploy the ingestion half at zero marginal cost.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: tenantiq

resources:
  - ../../base
  - namespace.yaml
  - ingress.yaml
  - networkpolicy.yaml

patches:
  # One document per entry: kustomize's PatchTransformer parses a single patch per path, so a
  # multi-document file fails to build rather than applying the first one silently.
  - path: patch-frontend-replicas.yaml
  - path: patch-backend-replicas.yaml
  - path: patch-worker-replicas.yaml

configMapGenerator:
  - name: tenantiq-config
    behavior: merge
    literals:
      - DJANGO_DEBUG=false
      - DJANGO_ALLOWED_HOSTS=tenantiq-backend,tenantiq-backend.svc.cluster.local
      # Managed Redis; the host comes from the deployment, not from a Service in this namespace.
      - REDIS_URL=redis://tenantiq-redis.example.internal:6379/0
      # #88: 0.0 refuses nothing, so the product answers every question whether or not the corpus
      # can. Left at the base default on purpose — the defensible value depends on the embedder #53
      # chooses, and guessing one here would look like a decision that has not been made.
      - TENANTIQ_RETRIEVAL_MIN_SIMILARITY=0.0
      # Voyage, not the local Ollama backend, which does not run in this namespace (#53, ADR-0020).
      # The key lives in `tenantiq-secrets`; without it the embedder raises before making a request,
      # so a missing key is a clear configuration error rather than a vendor 401.
      - TENANTIQ_EMBEDDER_FACTORY=app.embeddings.build_voyage_embedder
      - TENANTIQ_VOYAGE_MODEL=voyage-4
  - name: tenantiq-frontend-config
    literals:
      - APP_BASE_URL=https://tenantiq.example.com

images:
  - name: tenantiq/backend
    newTag: latest # the pipeline (#25) replaces this with the released digest
  - name: tenantiq/frontend
    newTag: latest
