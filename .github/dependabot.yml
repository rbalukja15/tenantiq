version: 2
updates:
  # ci.yml pins every action to a commit (#25, ADR-0022), so nothing it runs can change under it.
  # This is what keeps those pins from going stale: one pull request a week moving them all, with
  # the commit and the version comment updated together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
