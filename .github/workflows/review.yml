name: Review

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Runs the ponytail-review skill on the pull request and posts its report
  # as one comment. It reviews once per PR; re-run the job from the Actions
  # tab to review again after new pushes.
  ponytail:
    # Pull requests from forks get no secrets, so they are skipped instead of failing.
    if: >-
      github.event.pull_request.draft == false &&
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # A stuck review would otherwise run, and use the subscription, for up to six hours.
    timeout-minutes: 15
    steps:
      # This job holds the subscription token, so nothing it runs sits on a moving tag.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      # The plugin runs its own hooks next to the token, so it is fetched at a fixed
      # release. The action can't pin a marketplace URL, only take a local path. Bump the
      # commit on purpose, after reading what changed.
      - name: Fetch ponytail v5.3.3
        run: |
          git init -q "$RUNNER_TEMP/ponytail"
          git -C "$RUNNER_TEMP/ponytail" fetch -q --depth 1 \
            https://github.com/DietrichGebert/ponytail.git 7801d061243d7b753bad0e0b3c057cd250b11755
          git -C "$RUNNER_TEMP/ponytail" checkout -q FETCH_HEAD
      - uses: anthropics/claude-code-action@4fa93a88de49bbef68b10eb15aabedf28ca0e1ed # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Comments come from github-actions[bot] instead of a separate app.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          include_fix_links: false
          plugin_marketplaces: ${{ runner.temp }}/ponytail
          plugins: ponytail@ponytail
          prompt: |
            Use the ponytail-review skill to review pull request #${{ github.event.pull_request.number }}
            in ${{ github.repository }}. The change is the diff between origin/${{ github.base_ref }} and HEAD;
            read `gh pr view ${{ github.event.pull_request.number }}` for its description.

            Post the full report as a single comment with
            `gh pr comment ${{ github.event.pull_request.number }} --body-file <file>`.
            The comment is the report only: no title naming a tool, no signature,
            no footer, no links to any website.
          claude_args: >-
            --allowedTools "Read,Grep,Glob,Write,Skill,Bash(git diff:*),Bash(git log:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*)"
