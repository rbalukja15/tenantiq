[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tenantiq-backend"
version = "0.1.0"
description = "TenantIQ backend — multi-tenant RAG API"
requires-python = ">=3.12"
dependencies = [
    # Upper bound is deliberate (#71): Django 6.1 removed `django.utils.cache.cc_delim_re`, which
    # every released DRF (through 3.17.2) still imports — so an unpinned `django>=5.0` silently
    # resolved to a pair that fails at import time, turning CI red with no commit behind it. DRF's
    # own `django>=4.2` is unbounded and offers no protection. Raise this ceiling only together with
    # a DRF release that declares support for the newer Django (check its `Framework :: Django ::`
    # classifiers), not as a routine bump.
    "django>=5.0,<6.1",
    "djangorestframework>=3.15",
    "celery>=5.3",
    "redis>=5.0",
    "pgvector>=0.3",
    "psycopg[binary]>=3.1",
    "anthropic>=0.40",
    "pyjwt[crypto]>=2.8",
    "dj-database-url>=2.1",
    "python-dotenv>=1.0",
    "pypdf>=4",
]

[project.optional-dependencies]
# Floors only. The exact versions live in requirements-dev.lock, which is what `make bootstrap` and
# CI install from — see ADR-0018. `packaging` is declared rather than inherited from black so that
# tests/test_toolchain.py does not import a transitive dependency by luck. pip-tools is deliberately
# absent: `make lock` runs it inside the release image, so shipping it (and the pip/setuptools pins
# it drags in) to every developer and every CI run would buy nothing.
dev = ["pytest>=8.0", "pytest-django>=4.8", "ruff>=0.6", "black>=24.0", "packaging>=24.0"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Pin the ruleset explicitly to Ruff's historical default (pycodestyle errors + Pyflakes) instead of
# relying on the moving default `select`: Ruff 0.16 broadened the built-in default, which would newly
# flag ~80 findings across the existing codebase and break CI on a linter upgrade nobody chose. This
# keeps lint deterministic across Ruff versions; adopting newer rule families (RUF/SIM/UP/…) is a
# separate, intentional cleanup.
select = ["E4", "E7", "E9", "F"]

[tool.black]
line-length = 100
# Stated, not inferred (#54). Black otherwise picks a target from the interpreter running it, so the
# same file formats differently on two machines and `--check` warns that it cannot verify its own
# output. 3.12 is the floor `requires-python` declares, which is the version every environment here
# is guaranteed to have.
target-version = ["py312"]

[tool.setuptools.packages.find]
include = ["app*", "config*"]
namespaces = false

[tool.pytest.ini_options]
pythonpath = ["."]
DJANGO_SETTINGS_MODULE = "config.settings"
